openapi: 3.0.0
info:
  title: Monoton API
  description: REST API for Monoton B2B Invoice Settlement Platform
  version: 1.0.0

tags:
  - name: Health
  - name: Auth
  - name: Invoices
  - name: Wallet

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      operationId: healthCheck
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Login and get access token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials

  /v1/invoices:
    get:
      tags: [Invoices]
      summary: List all invoices for authenticated party
      operationId: listInvoices
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of invoices
          content:
            application/json:
              schema:
                type: object
                properties:
                  invoices:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invoice'
                  count:
                    type: integer

    post:
      tags: [Invoices]
      summary: Create a new invoice
      operationId: createInvoice
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvoiceRequest'
      responses:
        '201':
          description: Invoice created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'

  /v1/invoices/{invoiceId}:
    get:
      tags: [Invoices]
      summary: Get invoice details
      operationId: getInvoice
      security:
        - bearerAuth: []
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invoice details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'

  /v1/invoices/{invoiceId}/approve:
    post:
      tags: [Invoices]
      summary: Approve an invoice (buyer only)
      operationId: approveInvoice
      security:
        - bearerAuth: []
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invoice approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'

  /v1/invoices/{invoiceId}/reject:
    post:
      tags: [Invoices]
      summary: Reject an invoice (buyer only)
      operationId: rejectInvoice
      security:
        - bearerAuth: []
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Invoice rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'

  /v1/invoices/{invoiceId}/settle:
    post:
      tags: [Invoices]
      summary: Settle an invoice using Path A atomic batch
      operationId: settleInvoice
      security:
        - bearerAuth: []
      parameters:
        - name: invoiceId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                autoMerge:
                  type: boolean
                  default: true
      responses:
        '200':
          description: Invoice settled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceResponse'

  /v1/wallet/balance:
    get:
      tags: [Wallet]
      summary: Get wallet balance
      operationId: getWalletBalance
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Wallet balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletBalance'

  /v1/wallet/transactions:
    get:
      tags: [Wallet]
      summary: List wallet transactions
      operationId: listWalletTransactions
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of transactions
          content:
            application/json:
              schema:
                type: object
                properties:
                  transactions:
                    type: array
                    items:
                      $ref: '#/components/schemas/WalletTransaction'

  /v1/wallet/mint:
    post:
      tags: [Wallet]
      summary: Mint test tokens (via Faucet)
      operationId: mintTokens
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MintRequest'
      responses:
        '200':
          description: Tokens minted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MintResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        timestamp:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer

    Invoice:
      type: object
      properties:
        invoiceId:
          type: string
        seller:
          type: string
        buyer:
          type: string
        amount:
          type: object
          properties:
            amount:
              type: string
            currency:
              type: string
        status:
          type: string
          enum: [Created, Approved, AwaitingSettlement, Settled, Rejected]
        dueDate:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    CreateInvoiceRequest:
      type: object
      required:
        - buyer
        - amount
        - description
      properties:
        buyer:
          type: string
        amount:
          type: number
        currency:
          type: string
          default: USD
        description:
          type: string
        dueDate:
          type: string
          format: date
        metadata:
          type: object
          additionalProperties:
            type: string

    InvoiceResponse:
      type: object
      properties:
        invoiceId:
          type: string
        status:
          type: string
        transactionId:
          type: string

    WalletBalance:
      type: object
      properties:
        party:
          type: string
        balance:
          type: object
          properties:
            amount:
              type: string
            currency:
              type: string
        lastUpdated:
          type: string
          format: date-time

    WalletTransaction:
      type: object
      properties:
        transactionId:
          type: string
        type:
          type: string
          enum: [Mint, Transfer, Receive, Settle]
        amount:
          type: object
          properties:
            amount:
              type: string
            currency:
              type: string
        counterparty:
          type: string
        timestamp:
          type: string
          format: date-time

    MintRequest:
      type: object
      required:
        - amount
      properties:
        amount:
          type: number
        currency:
          type: string
          default: USD

    MintResponse:
      type: object
      properties:
        transactionId:
          type: string
        amount:
          type: object
          properties:
            amount:
              type: string
            currency:
              type: string
        newBalance:
          type: object
          properties:
            amount:
              type: string
            currency:
              type: string

    InternalError:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
